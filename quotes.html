 {s:"Security",q:[

 ]}

document.getElementById('q').innerHTML=QUOTES.map(function(g){
 return '<section class="qsec"><h2 class="mono">'+esc(g.s)+'</h2>'+g.q.map(function(x){return '<blockquote class="q"><p>'+esc(x[0])+'</p><cite>- '+esc(x[1])+'</cite></blockquote>'}).join('')+'</section>'}).join('');
