<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog - Mayank Raheja</title>
<meta name="description" content="Writing on DevSecOps, application security and AI security by Mayank Raheja.">
<link rel="icon" href="icon.ico">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<nav><div class="wrap">
<a class="logo mono" href="index.html">mayank<span>@</span>raheja</a>
<div class="navr"><ul class="mono"><li><a href="lab.html">lab</a></li><li><a href="projects.html">projects</a></li><li><a href="blog.html">blog</a></li><li><a href="quotes.html">quotes</a></li></ul>
<button class="theme" id="themeBtn" aria-label="Toggle theme">☾</button></div>
</div></nav>
<main class="wrap page" id="main"><p class="sub">Loading…</p></main>
<footer class="mono">© <span id="y"></span> Mayank Raheja · Bengaluru, India</footer>
<script src="assets/md.js"></script>
<script src="assets/site.js"></script>
<script>
// Posts live in posts/*.md; posts/index.json is generated by: node tools/post.js build
var main=document.getElementById('main'),POSTS=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function mins(w){return Math.max(1,Math.round(w/200))}
function tags(p){return '<div class="tagrow">'+(p.sample?'<span class="chip draft">sample</span>':'')+p.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+'</div>'}
function list(){
  document.title='Blog - Mayank Raheja';
  if(!POSTS.length){main.innerHTML='<h1>Blog</h1><p class="sub">No posts yet. Check back soon.</p>';return}
  var all={};POSTS.forEach(function(x){x.tags.forEach(function(t){all[t]=1})});
  main.innerHTML='<h1>Blog</h1><p class="sub">Notes on DevSecOps, AppSec and AI security.</p><div class="filters mono" id="f"><button class="on" data-t="">all</button>'+Object.keys(all).map(function(t){return '<button data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div><div class="grid" id="g"></div>';
  function draw(t){document.getElementById('g').innerHTML=POSTS.filter(function(x){return !t||x.tags.indexOf(t)>-1}).map(function(x){var ext=x.url&&/^https:\/\//.test(x.url);return '<a class="card post-card" href="'+(ext?esc(x.url)+'" target="_blank" rel="noopener':'#'+x.slug)+'"><div class="meta mono">'+fmt(x.date)+' · '+mins(x.words)+' min'+(ext?' · medium ↗':'')+'</div><h3 style="margin-top:6px">'+esc(x.title)+'</h3><p>'+esc(x.summary)+'</p>'+tags(x)+'</a>'}).join('')}
  draw('');
  document.getElementById('f').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(c){c.classList.remove('on')});b.classList.add('on');draw(b.dataset.t)};
}
function show(p){
  document.title=p.title+' - Mayank Raheja';
  main.innerHTML='<p class="sub">Loading…</p>';
  fetch('posts/'+encodeURIComponent(p.file)).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
    main.innerHTML='<article class="article"><a class="mono" href="blog.html" onclick="location.hash=\'\';return false">← all posts</a><h1>'+esc(p.title)+'</h1><div class="meta mono">'+fmt(p.date)+' · '+mins(p.words)+' min read</div>'+tags(p)+window.md(t)+'</article>';
    window.scrollTo(0,0);
  }).catch(function(){main.innerHTML='<p class="sub">Could not load this post.</p><a class="mono" href="blog.html">← all posts</a>'});
}
function render(){
  var slug=decodeURIComponent(location.hash.slice(1)),p=/^[a-z0-9-]+$/.test(slug)&&POSTS.filter(function(x){return x.slug===slug})[0];
  if(p)show(p);else list();
}
fetch('posts/index.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){POSTS=j;render()})
.catch(function(){main.innerHTML='<h1>Blog</h1><p class="sub">Posts could not be loaded. (Opening the file directly via file:// blocks this; serve the folder with <code>python3 -m http.server</code>.)</p>'});
window.addEventListener('hashchange',render);
</script>
</body>
</html>
