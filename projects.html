// Edit this list. `link` is optional.
var PROJECTS=[
 {n:"DevSecOps & AI security tooling",d:"Placeholder - describe a security tool, pipeline or research project you can share publicly, with a link to the repo.",t:["Security","DevSecOps","AI"],soon:true},
 {n:"Ezy.cv",d:"Messenger bot that interviews you and builds your résumé, and can generate a website for you. Runners-up at Hacktrec @ ABES College.",t:["Bots"]},
 {n:"Nutrify_me",d:"Messenger bot that returns nutritional values of a product from its UPC code.",t:["Bots"]},
 {n:"Utube-mp3",d:"Telegram bot that takes a YouTube link and replies with the downloadable audio file.",t:["Bots"]},
 {n:"Orient",d:"Mobile application.",t:["Mobile"]}
];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function draw(t){document.getElementById('g').innerHTML=PROJECTS.filter(function(p){return !t||p.t.indexOf(t)>-1}).map(function(p){
 return '<div class="card"><h3>'+esc(p.n)+(p.soon?' <span class="chip draft">placeholder</span>':'')+'</h3><p>'+esc(p.d)+'</p><div class="chips">'+p.t.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('')+'</div>'+(p.link?'<a class="more mono" href="'+esc(p.link)+'" target="_blank" rel="noopener">view →</a>':'')+'</div>'}).join('')}
draw('');
document.getElementById('f').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(c){c.classList.remove('on')});b.classList.add('on');draw(b.dataset.t)};
</script>
