<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var L=window.LABS,cats={};L.forEach(function(x){cats[x.category]=1});
document.getElementById('f').innerHTML='<button class="on" data-t="">all</button>'+Object.keys(cats).map(function(c){return '<button data-t="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
function draw(t){document.getElementById('g').innerHTML=L.filter(function(x){return !t||x.category===t}).map(function(x){return '<a class="card post-card" href="labs/'+x.slug+'.html"><div style="font-size:26px">'+x.icon+'</div><h3 style="margin-top:6px">'+esc(x.title)+'</h3><p>'+esc(x.summary)+'</p><div class="chips"><span class="chip">'+esc(x.category)+'</span><span class="chip">'+esc(x.level)+'</span>'+x.tags.map(function(g){return '<span class="chip">'+esc(g)+'</span>'}).join('')+'</div></a>'}).join('')}
draw('');
document.getElementById('f').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(c){c.classList.remove('on')});b.classList.add('on');draw(b.dataset.t)};
</script>
