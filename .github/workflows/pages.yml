name: Build & deploy site

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # daily: picks up new Medium posts

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Regenerates posts/index.json from posts/*.md (fails on invalid front matter)
      - name: Build blog index
        run: python3 tools/post.py build
      # Publish only site files (not tooling, workflows or zips)
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='tools' --exclude='_site' --exclude='*.zip' --exclude='.DS_Store' --exclude='index-old.html' --exclude='_template.html' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
